<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TrueGrit Firm Pipeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
<style>
/* Layout: case-file desk. Fixed left rail of views, working surface on the right, firm dossier slides over from the right edge. */
:root{
  --paper:#f4f5f2; --sheet:#ffffff; --ink:#18212b; --ink-2:#4a5664; --rule:#d9ddd6; --rule-2:#e8ebe5;
  --binding:#6f2a32; --binding-soft:#f3e7e8; --rail:#1d2732; --rail-ink:#c9d1d9;
  --ok:#2f6b4f; --ok-bg:#e3f0e8; --est:#8a5a12; --est-bg:#f8edd9; --miss:#5f6873; --miss-bg:#eceff1; --bad:#9b2c2c; --bad-bg:#f8e3e1; --info:#2c5282; --info-bg:#e2ebf6;
  --f-display:"Source Serif 4", Georgia, "Times New Roman", serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-data:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#12171d; --sheet:#1a2129; --ink:#e6e9ec; --ink-2:#9aa6b2; --rule:#2c3640; --rule-2:#232c35;
  --binding:#d48a93; --binding-soft:#3a2427; --rail:#0d1116; --rail-ink:#aeb8c2;
  --ok:#7cc7a0; --ok-bg:#1d3329; --est:#e3b25f; --est-bg:#3a2e17; --miss:#a3adb7; --miss-bg:#262e36; --bad:#f09a92; --bad-bg:#3d2221; --info:#8fb6e6; --info-bg:#1e2c3d; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12171d; --sheet:#1a2129; --ink:#e6e9ec; --ink-2:#9aa6b2; --rule:#2c3640; --rule-2:#232c35;
  --binding:#d48a93; --binding-soft:#3a2427; --rail:#0d1116; --rail-ink:#aeb8c2;
  --ok:#7cc7a0; --ok-bg:#1d3329; --est:#e3b25f; --est-bg:#3a2e17; --miss:#a3adb7; --miss-bg:#262e36; --bad:#f09a92; --bad-bg:#3d2221; --info:#8fb6e6; --info-bg:#1e2c3d; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
a{color:var(--info)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--binding);outline-offset:2px}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100%}
.rail{background:var(--rail);color:var(--rail-ink);padding:22px 0;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:22px}
.brand{padding:0 20px}
.brand b{display:block;font:600 19px/1.15 var(--f-display);color:#fff;letter-spacing:.01em}
.brand span{font:500 10.5px/1.4 var(--f-data);letter-spacing:.14em;text-transform:uppercase;color:var(--rail-ink);opacity:.75}
.nav{display:flex;flex-direction:column}
.nav button{all:unset;cursor:pointer;padding:9px 20px;display:flex;justify-content:space-between;align-items:center;color:var(--rail-ink);border-left:3px solid transparent}
.nav button:hover{background:rgba(255,255,255,.04)}
.nav button[aria-current="true"]{color:#fff;border-left-color:#d48a93;background:rgba(255,255,255,.06)}
.nav .ct{font:500 11px var(--f-data);opacity:.8}
.rail .foot{margin-top:auto;padding:0 20px;font:11px/1.5 var(--f-data);opacity:.7}
main{min-width:0;padding-block:26px 60px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.head{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
h1{font:600 26px/1.15 var(--f-display);margin:0;text-wrap:balance}
.sub{color:var(--ink-2);margin-top:4px;max-width:70ch}
.banner{border:1px solid var(--rule);background:var(--sheet);border-left:3px solid var(--binding);padding:10px 14px;margin-bottom:18px;color:var(--ink-2);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.kpi{background:var(--sheet);border:1px solid var(--rule);padding:14px 16px}
.kpi .l{font:500 10.5px var(--f-data);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.kpi .v{font:600 28px/1.1 var(--f-display);margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .n{font-size:12px;color:var(--ink-2);margin-top:2px}
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px}
.panel{background:var(--sheet);border:1px solid var(--rule);padding:16px 18px;min-width:0}
.panel h2{font:600 16px var(--f-display);margin:0 0 10px}
.eyebrow{font:500 10.5px var(--f-data);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:150px 1fr 34px;gap:10px;align-items:center;font-size:13px}
.bar .t{height:10px;background:var(--rule-2);position:relative}
.bar .t i{position:absolute;inset:0 auto 0 0;background:var(--binding)}
.bar .c{font:500 12px var(--f-data);text-align:right;font-variant-numeric:tabular-nums}
.summary{white-space:pre-wrap;line-height:1.6;max-width:72ch}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.filters input,.filters select{background:var(--sheet);border:1px solid var(--rule);padding:7px 10px;min-width:0}
.filters input{flex:1 1 220px}
.filters label{display:flex;gap:6px;align-items:center;color:var(--ink-2);font-size:13px}
.tablewrap{overflow-x:auto;background:var(--sheet);border:1px solid var(--rule)}
table{border-collapse:collapse;width:100%;min-width:980px}
th{font:500 10.5px var(--f-data);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);text-align:left;padding:10px 12px;border-bottom:1px solid var(--rule);white-space:nowrap;cursor:pointer;user-select:none}
th[aria-sort="ascending"]::after{content:" \2191"}th[aria-sort="descending"]::after{content:" \2193"}
td{padding:10px 12px;border-bottom:1px solid var(--rule-2);vertical-align:top}
tbody tr{cursor:pointer}
td:first-child,th:first-child{min-width:230px}
.dossier .bar{grid-template-columns:200px 1fr 44px}
tbody tr:hover td{background:var(--paper)}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums;white-space:nowrap}
.fname{font:600 14.5px/1.3 var(--f-display)}
.muted{color:var(--ink-2);font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;font:500 11.5px/1.5 var(--f-body);border-radius:2px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-high{background:var(--ok-bg);color:var(--ok)}.p-mod{background:var(--info-bg);color:var(--info)}.p-low{background:var(--miss-bg);color:var(--miss)}.p-ins{background:var(--est-bg);color:var(--est)}
.tag{display:inline-block;font:500 10px/1.6 var(--f-data);letter-spacing:.06em;text-transform:uppercase;padding:0 5px;border:1px solid currentColor;border-radius:2px;margin-left:5px;vertical-align:1px}
.s-verified{color:var(--ok)}.s-estimated{color:var(--est)}.s-missing,.s-unknown{color:var(--miss)}.s-conflicting{color:var(--bad)}.s-sample_demo{color:var(--info)}.s-review{color:var(--binding)}
.empty{padding:40px 20px;text-align:center;color:var(--ink-2)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.card{background:var(--sheet);border:1px solid var(--rule);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.card dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.card dt{color:var(--ink-2)}.card dd{margin:0;min-width:0;overflow-wrap:anywhere}
.btn{border:1px solid var(--rule);background:var(--sheet);padding:7px 12px;cursor:pointer}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--binding);border-color:var(--binding);color:var(--sheet)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
/* dossier drawer */
.scrim{position:fixed;inset:0;background:rgba(10,14,18,.35)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--paper);border-left:1px solid var(--rule);overflow-y:auto;padding-block:max(20px,env(safe-area-inset-top,0px)) 60px;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px));box-shadow:-12px 0 30px rgba(0,0,0,.12)}
.drawer .close{position:sticky;top:0;float:right}
.dossier h2{font:600 24px/1.2 var(--f-display);margin:4px 0 4px}
.sec{margin-top:22px}
.sec>h3{font:500 11px var(--f-data);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin:0 0 8px;padding-bottom:6px;border-bottom:1px solid var(--rule)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.fact{background:var(--sheet);border:1px solid var(--rule);padding:10px 12px;min-width:0}
.fact .l{font-size:12px;color:var(--ink-2)}
.fact .v{font-weight:600;margin-top:2px;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--sheet);border:1px solid var(--rule);padding:2px 8px;font-size:12.5px}
.chip.neg{border-color:var(--bad);color:var(--bad)}.chip.pos{border-color:var(--ok);color:var(--ok)}
ul.plain{margin:0;padding-left:18px}ul.plain li{margin:3px 0}
.ev{display:grid;grid-template-columns:120px minmax(0,1fr);gap:4px 14px;padding:10px 0;border-bottom:1px solid var(--rule-2);font-size:13px}
.ev .f{font:500 12px var(--f-data);color:var(--ink-2)}
.ev q{display:block;color:var(--ink-2);font-style:italic;margin-top:3px}
.ev q::before,.ev q::after{content:""}
.review-form{display:grid;gap:10px;background:var(--sheet);border:1px solid var(--rule);padding:14px}
.review-form select,.review-form input,.review-form textarea{background:var(--paper);border:1px solid var(--rule);padding:8px 10px;width:100%}
.review-form textarea{min-height:80px;resize:vertical}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;font-size:13px}
.kv{display:grid;grid-template-columns:200px minmax(0,1fr);gap:6px 16px;font-size:13px}
.kv dt{color:var(--ink-2)}.kv dd{margin:0;overflow-wrap:anywhere}
.terms{columns:2 260px;column-gap:24px;font-size:13px}
.terms div{break-inside:avoid;margin-bottom:12px}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:sticky;top:0;height:auto;padding:12px 0;z-index:5;flex-direction:row;align-items:center;gap:10px;overflow-x:auto}
  .brand{padding:0 16px;flex:0 0 auto}.brand span{display:none}
  .nav{flex-direction:row}.nav button{border-left:0;border-bottom:3px solid transparent;padding:8px 12px;gap:6px}
  .nav button[aria-current="true"]{border-bottom-color:#d48a93}
  .nav button{white-space:nowrap}
  .filters label{white-space:nowrap}
  .rail .foot{display:none}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .grid2{grid-template-columns:1fr}
  .drawer{padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px))}
  .ev{grid-template-columns:1fr}.kv{grid-template-columns:1fr}
  .bar{grid-template-columns:110px 1fr 30px}
}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Views">
    <div class="brand"><b>TrueGrit × VIMANA</b><span>Acquisition research</span></div>
    <div class="nav" id="nav"></div>
    <div class="foot" id="foot"></div>
  </nav>
  <main id="main"></main>
</div>
<div id="drawerRoot"></div>
<div id="toast" class="toast" hidden></div>
<script id="__data" type="application/json">__DATA_PLACEHOLDER__</script>
<script>
(function(){
var REVIEW_URL = "__REVIEW_URL__";
var ACCESS_KEY = "__ACCESS_KEY__";
var raw = document.getElementById('__data').textContent;
var D;
try { D = JSON.parse(decodeURIComponent(escape(atob(raw)))); } catch (e) { D = { leads: [], analysis: [], sources: [], review: [], runs: [], dashboard: [], config: {} }; }

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function val(v){ return (v === null || v === undefined || v === '' || v === 'Unknown' || v === 'n/a') ? null : v; }
function num(v){ var n = Number(v); return isFinite(n) && v !== '' && v !== null ? n : null; }
function list(s){ return String(s || '').split(/;\s*/).map(function(x){ return x.trim(); }).filter(Boolean); }
function fmtDate(s){ if(!s) return ''; var d = new Date(s); return isNaN(d) ? String(s) : d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}); }
function money(n){ n = num(n); if (n === null) return null; return n >= 1e6 ? '$' + (n/1e6).toFixed(1) + 'M' : '$' + Math.round(n).toLocaleString(); }

// ---- join records by company_id
var byId = {};
function rec(id){ return byId[id] || (byId[id] = { id: id, lead: {}, ai: {}, review: null, sources: [] }); }
(D.leads||[]).forEach(function(r){ if(r.company_id) rec(r.company_id).lead = r; });
(D.analysis||[]).forEach(function(r){ if(r.company_id) rec(r.company_id).ai = r; });
(D.review||[]).forEach(function(r){ if(r.company_id && byId[r.company_id]) byId[r.company_id].review = r; });
(D.sources||[]).forEach(function(r){ if(r.company_id && byId[r.company_id]) byId[r.company_id].sources.push(r); });
var firms = Object.keys(byId).map(function(k){
  var f = byId[k], L = f.lead, A = f.ai;
  f.name = L.company_name || A.company_name || k;
  f.state = L.state || A.state || '';
  f.city = L.city || '';
  f.fit = L.final_fit || A.final_fit || 'Insufficient Information';
  f.score = num(A.normalized_score !== undefined ? A.normalized_score : L.normalized_score);
  f.coverage = num(A.evidence_coverage_pct);
  f.ins = num(L.insurance_score !== undefined ? L.insurance_score : A.insurance_score);
  f.insBand = L.insurance_band || A.insurance_band || '';
  f.att = num(L.attorney_count);
  f.sample = (L.data_mode || A.data_mode) !== 'LIVE';
  f.decision = f.review && f.review.reviewer_decision ? f.review.reviewer_decision : '';
  f.reviewStatus = f.decision ? 'Reviewed' : (L.review_status || (f.review ? 'Needs review' : (f.fit === 'Low Fit' ? 'Screened out' : 'Needs more evidence')));
  f.last = L.last_collected_at || A.analyzed_at || '';
  f.missing = list(A.missing_information);
  // field status from evidence log
  f.statusOf = function(field){
    var hits = f.sources.filter(function(s){ return s.field === field; });
    if (!hits.length) return null;
    var st = hits.map(function(h){ return h.status; });
    var vals = {}; hits.forEach(function(h){ if (val(h.value)) vals[String(h.value).toLowerCase()] = 1; });
    if (Object.keys(vals).length > 1 && st.indexOf('verified') > -1) return 'conflicting';
    return st.indexOf('verified') > -1 ? 'verified' : st[0];
  };
  return f;
});
var hasLive = firms.some(function(f){ return !f.sample; });
function vis(f){ return !(state.hideSample && f.sample); }
function inQueue(f){ return f.review && (f.decision || f.fit === 'High Fit' || f.fit === 'Moderate Fit'); }
var counts = function(fn){ return firms.filter(function(f){ return vis(f) && fn(f); }).length; };

var cfg = D.config || {};
var state = { view: (location.hash || '#overview').slice(1), q: '', st: '', fit: '', rs: '', hideSample: hasLive, sort: 'score', dir: -1 };
var VIEWS = [
  ['overview','Overview', function(){ return ''; }],
  ['pipeline','Firm pipeline', function(){ return counts(function(){ return true; }); }],
  ['review','Review queue', function(){ return counts(function(f){ return inQueue(f) && !f.decision; }); }],
  ['runs','Workflow runs', function(){ return (D.runs||[]).length; }],
  ['criteria','Criteria', function(){ return ''; }]
];
function fitPill(fit){
  var c = fit === 'High Fit' ? 'p-high' : fit === 'Moderate Fit' ? 'p-mod' : fit === 'Low Fit' ? 'p-low' : 'p-ins';
  return '<span class="pill ' + c + '">' + esc(fit) + '</span>';
}
function stTag(s){ if(!s) return ''; var label = {verified:'Verified',estimated:'Estimated',missing:'Missing',unknown:'Missing',conflicting:'Conflicting',sample_demo:'Sample'}[s] || s; return '<span class="tag s-' + esc(s) + '">' + esc(label) + '</span>'; }

function renderNav(){
  document.getElementById('nav').innerHTML = VIEWS.map(function(v){
    var c = v[2](); return '<button data-v="' + v[0] + '" aria-current="' + (state.view === v[0]) + '"><span>' + v[1] + '</span><span class="ct">' + (c === '' ? '' : c) + '</span></button>';
  }).join('');
  document.getElementById('foot').innerHTML = 'Data refreshed<br>' + esc(fmtDate(D.generated_at)) + '<br><br>Research only. A person decides whether to pursue any firm.';
}
document.getElementById('nav').addEventListener('click', function(e){ var b = e.target.closest('button'); if(!b) return; location.hash = b.getAttribute('data-v'); });
window.addEventListener('hashchange', function(){ state.view = (location.hash || '#overview').slice(1); render(); });

function sampleBanner(){
  var s = firms.filter(function(f){ return f.sample; }).length;
  if (!s) return '';
  return '<div class="banner">' + (state.hideSample ? s + ' sample/demo records from early test runs are hidden. Untick \u201cHide sample data\u201d in the Firm pipeline to show them.' : s + ' of ' + firms.length + ' records are sample/demo data from test runs, not real firms.') + '</div>';
}

function viewOverview(){
  var live = firms.filter(function(f){ return !f.sample; });
  var shown = firms.filter(vis);
  var dash = (D.dashboard || []).slice(-1)[0] || {};
  var fits = ['High Fit','Moderate Fit','Low Fit','Insufficient Information'];
  var max = Math.max(1, Math.max.apply(null, fits.map(function(k){ return counts(function(f){ return f.fit === k; }); })));
  var miss = {}; shown.forEach(function(f){ f.missing.forEach(function(m){ if(/^Unscored/.test(m)) return; miss[m] = (miss[m]||0) + 1; }); });
  var topMiss = Object.keys(miss).sort(function(a,b){ return miss[b]-miss[a]; }).slice(0,6);
  var withEv = counts(function(f){ return f.sources.some(function(s){ return s.status === 'verified' && /^https?:/.test(s.source_url || ''); }); });
  var pending = counts(function(f){ return inQueue(f) && !f.decision; });
  var lastRun = (D.runs || []).slice(-1)[0] || {};
  var summary = dash.executive_summary || dash.ai_executive_summary || dash.summary || '';
  var top = shown.filter(function(f){ return f.fit === 'High Fit' || f.fit === 'Moderate Fit'; }).sort(function(a,b){ return (b.score||0)-(a.score||0); }).slice(0,6);
  return '<div class="head"><div><div class="eyebrow">Pilot · Florida & Georgia insurance-defense firms</div><h1>Research overview</h1><div class="sub">Where the pipeline stands: firms found, how they screen against the sponsor criteria, and what still needs a person to check.</div></div></div>' + sampleBanner() +
  '<div class="kpis">' +
    '<div class="kpi"><div class="l">Firms researched</div><div class="v">' + shown.length + '</div><div class="n">' + live.length + ' live · ' + counts(function(f){return f.state==='FL';}) + ' FL · ' + counts(function(f){return f.state==='GA';}) + ' GA</div></div>' +
    '<div class="kpi"><div class="l">High or moderate fit</div><div class="v">' + counts(function(f){ return f.fit==='High Fit'||f.fit==='Moderate Fit'; }) + '</div><div class="n">Provisional weights</div></div>' +
    '<div class="kpi"><div class="l">Awaiting review</div><div class="v">' + pending + '</div><div class="n">In the review queue</div></div>' +
    '<div class="kpi"><div class="l">With sourced evidence</div><div class="v">' + withEv + '</div><div class="n">At least one verified, linked claim</div></div>' +
    '<div class="kpi"><div class="l">Last run</div><div class="v" style="font-size:18px">' + esc(fmtDate(lastRun.finished_at || lastRun.run_at || lastRun.generated_at || D.generated_at)) + '</div><div class="n">' + esc(lastRun.status || lastRun.run_status || '') + '</div></div>' +
  '</div>' +
  '<div class="grid2"><div class="panel"><h2>Fit distribution</h2><div class="bars">' + fits.map(function(k){ var c = counts(function(f){ return f.fit===k; }); return '<div class="bar"><span>' + k + '</span><span class="t"><i style="width:' + (c/max*100) + '%"></i></span><span class="c">' + c + '</span></div>'; }).join('') + '</div>' +
  '<h2 style="margin-top:20px">Most common gaps</h2>' + (topMiss.length ? '<ul class="plain">' + topMiss.map(function(m){ return '<li>' + esc(m) + ' <span class="muted">(' + miss[m] + ')</span></li>'; }).join('') + '</ul>' : '<div class="muted">No gaps recorded yet.</div>') + '</div>' +

function filtered(){
  var q = state.q.toLowerCase();
  var out = firms.filter(function(f){
    if (state.hideSample && f.sample) return false;
    if (state.st && f.state !== state.st) return false;
    if (state.fit && f.fit !== state.fit) return false;
    if (state.rs && f.reviewStatus !== state.rs) return false;
    if (q && (f.name + ' ' + f.city + ' ' + (f.lead.practice_areas||'')).toLowerCase().indexOf(q) === -1) return false;
    return true;
  });
  var key = state.sort, dir = state.dir;
  out.sort(function(a,b){
    var x = a[key], y = b[key];
    if (x === null || x === undefined || x === '') return 1; if (y === null || y === undefined || y === '') return -1;
    return (x > y ? 1 : x < y ? -1 : 0) * dir;
  });
  return out;
}

document.addEventListener('click', function(e){ var o = e.target.closest('[data-open]'); if (o) openFirm(o.getAttribute('data-open'), o.getAttribute('data-focus') === 'review'); });

function render(){
  if (!VIEWS.some(function(v){ return v[0] === state.view; })) state.view = 'overview';
  renderNav();
  var m = document.getElementById('main');
  m.innerHTML = state.view === 'pipeline' ? viewPipeline() : state.view === 'review' ? viewReview() : state.view === 'runs' ? viewRuns() : state.view === 'criteria' ? viewCriteria() : viewOverview();
  if (state.view === 'pipeline') bindPipeline();
}
render();
})();
</script>
</body>
</html>
